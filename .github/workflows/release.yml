name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the version PR branch and its commit
      pull-requests: write # open and update the version PR
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets compares against the base branch history

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Validate skill frontmatter
        run: npm run validate

      - name: Check README skills index is up to date
        run: npm run index:check

      # With pending changesets this opens or updates the "Version Packages" PR.
      # With none, the package version is already bumped and it publishes.
      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          publish: npm run changeset:publish
          commit: 'Version packages'
          title: 'Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
