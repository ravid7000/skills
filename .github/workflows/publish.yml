name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and pack the tarball without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance attestation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Validate skill frontmatter
        run: npm run validate

      - name: Check README skills index is up to date
        run: npm run index:check

      # A tag that disagrees with package.json would publish a version nobody
      # can trace back to a commit.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json version ${pkg_version}"

      - name: Pack without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'push' || !inputs.dry_run
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
